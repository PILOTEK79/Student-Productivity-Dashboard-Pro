<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Productivity Dashboard Pro</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">

        <h2>🎓 SPD Pro</h2>

        <ul>
            <li class="active">🏠 Dashboard</li>
            <li>📋 Tasks</li>
            <li>📚 Exams</li>
            <li>🎯 Goals</li>
            <li>🎓 GPA</li>
            <li>⏱ Timer</li>
            <li>📈 Analytics</li>
        </ul>

    </aside>

    <main class="main-content">

        <header>
            <h1>Student Productivity Dashboard Pro</h1>
            <p>Track your studies, goals and performance.</p>
        </header>

        <section class="cards">

            <div class="card">
                <h3>📋 Tasks Pending</h3>
                <p>5</p>
            </div>

            <div class="card">
                <h3>📚 Upcoming Exams</h3>
                <p>2</p>
            </div>

            <div class="card">
                <h3>⏱ Study Hours</h3>
                <p>12</p>
            </div>

            <div class="card">
                <h3>🎓 GPA</h3>
                <p>3.75</p>
            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
